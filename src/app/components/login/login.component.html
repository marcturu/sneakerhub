<div class="form-wrapper">
  <div class="card form-card">
    <div class="card-body">
      <h2 class="form-title">
        Log In
        <span class="badge bg-primary ms-2">Access</span>
      </h2>

      <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            id="username"
            type="text"
            class="form-control"
            placeholder="Your username"
            [class.is-invalid]="username?.invalid && (username?.dirty || username?.touched)"
            formControlName="username">
          <div class="invalid-feedback"
            *ngIf="username?.errors?.['required'] && (username?.dirty || username?.touched)">
            Username is required
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            placeholder="Your password"
            [class.is-invalid]="password?.invalid && (password?.dirty || password?.touched)"
            formControlName="password">
          <div class="invalid-feedback"
            *ngIf="password?.errors?.['required'] && (password?.dirty || password?.touched)">
            Password is required
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 btn-submit">
          Log In
        </button>

      </form>
    </div>
  </div>
</div>
