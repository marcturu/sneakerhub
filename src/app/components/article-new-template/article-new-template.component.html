<section class="form-wrapper">
  <div class="card form-card">
    <div class="card-body">
      <h2 class="form-title">
        Nuevo artículo
        <span class="badge bg-primary ms-2">Template</span>
      </h2>

      <form #articleForm="ngForm" (ngSubmit)="onSubmit(articleForm)" novalidate>
        <ng-container ngModelGroup="article">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre del artículo</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              [class.is-invalid]="nameField.invalid && (nameField.dirty || nameField.touched || articleForm.submitted)"
              placeholder="Nike Air Max 90"
              ngModel
              #nameField="ngModel"
              required>
              <div class="invalid-feedback"
                *ngIf="nameField.errors?.['required'] && (nameField.dirty || nameField.touched || articleForm.submitted)">
                El nombre de los zapatos es obligatorio
              </div>
          </div>

          <div class="mb-3">
            <label for="price" class="form-label">Precio (€)</label>
            <div class="input-group">
              <input
              type="number"
              id="price"
              name="price"
              class="form-control"
              [class.is-invalid]="priceField.invalid && (priceField.dirty || priceField.touched || articleForm.submitted)"
              placeholder="109.99"
              ngModel
              #priceField="ngModel"
              required
              min="0.1">
              <div class="invalid-feedback"
                *ngIf="priceField.errors?.['required'] && (priceField.dirty || priceField.touched || articleForm.submitted)">
                El precio de los zapatos es obligatorio

              </div>
              <div class="invalid-feedback"
                *ngIf="priceField.errors?.['min'] && (priceField.dirty || priceField.touched || articleForm.submitted)">
                El precio de los zapatos debe ser mayor que 0
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="imageUrl" class="form-label">URL de la imagen</label>
            <input
              type="text"
              id="imageUrl"
              name="imageUrl"
              class="form-control"
              [class.is-invalid]="imageUrlField.invalid && (imageUrlField.dirty || imageUrlField.touched || articleForm.submitted)"
              placeholder="https://www.direccion.com/nuevo-articulo.jpg"
              ngModel
              #imageUrlField="ngModel"
              required
              [pattern]="urlPattern">
              <div class="invalid-feedback"
                *ngIf="imageUrlField.errors?.['required'] && (imageUrlField.dirty || imageUrlField.touched || articleForm.submitted)">
                La URL de la imagen es obligatoria
              </div>
              <div class="invalid-feedback"
                *ngIf="imageUrlField.errors?.['pattern'] && (imageUrlField.dirty || imageUrlField.touched || articleForm.submitted)">
                La URL de la imagen de los zapatos no es una URL válida
              </div>
          </div>

          <div class="mb-3">
            <div class="form-check">
              <input
              type="checkbox"
              id="isOnSale"
              name="isOnSale"
              class="form-check-input"
              ngModel>
            <label for="isOnSale" class="form-check-label">En venta</label>
            </div>
          </div>
        </ng-container>

        <button
          type="submit"
          class="btn btn-primary w-100 btn-submit">
          Crear
        </button>

      </form>

    </div>
  </div>
</section>
