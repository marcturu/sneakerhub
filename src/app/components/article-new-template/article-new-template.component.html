<section class="form-wrapper">
  <div class="card form-card">
    <div class="card-body">
      <h2 class="form-title">
        New product
        <span class="badge bg-primary ms-2">Template</span>
      </h2>

      <form #articleForm="ngForm" (ngSubmit)="onSubmit(articleForm)" novalidate>
        <ng-container ngModelGroup="article">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              [class.is-invalid]="nameField.invalid && (nameField.dirty || nameField.touched || articleForm.submitted)"
              placeholder="Nike Air Max 90"
              ngModel
              #nameField="ngModel"
              required>
              <div class="invalid-feedback"
                *ngIf="nameField.errors?.['required'] && (nameField.dirty || nameField.touched || articleForm.submitted)">
                Product name is required
              </div>
          </div>

          <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <div class="input-group">
              <span class="input-group-text">€</span>
              <input
              type="number"
              id="price"
              name="price"
              class="form-control"
              [class.is-invalid]="priceField.invalid && (priceField.dirty || priceField.touched || articleForm.submitted)"
              placeholder="109.99"
              ngModel
              #priceField="ngModel"
              required>
              <div class="invalid-feedback"
                *ngIf="priceField.errors?.['required'] && (priceField.dirty || priceField.touched || articleForm.submitted)">
                Product price is required
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="imageUrl" class="form-label">Image URL</label>
            <input
              type="text"
              id="imageUrl"
              name="imageUrl"
              class="form-control"
              [class.is-invalid]="imageUrlField.invalid && (imageUrlField.dirty || imageUrlField.touched || articleForm.submitted)"
              placeholder="https://www.example.com/new-product.jpg"
              ngModel
              #imageUrlField="ngModel"
              required
              [pattern]="urlPattern">
              <div class="invalid-feedback"
                *ngIf="imageUrlField.errors?.['required'] && (imageUrlField.dirty || imageUrlField.touched || articleForm.submitted)">
                Image URL is required
              </div>
              <div class="invalid-feedback"
                *ngIf="imageUrlField.errors?.['pattern'] && (imageUrlField.dirty || imageUrlField.touched || articleForm.submitted)">
                The sneaker image URL is not a valid URL
              </div>
          </div>

          <div class="mb-3">
            <div class="form-check">
              <input
              type="checkbox"
              id="isOnSale"
              name="isOnSale"
              class="form-check-input"
              ngModel>
            <label for="isOnSale" class="form-check-label">For sale</label>
            </div>
          </div>
        </ng-container>

        <button
          type="submit"
          class="btn btn-primary w-100 btn-submit">
          Create
        </button>

      </form>

    </div>
  </div>
</section>
