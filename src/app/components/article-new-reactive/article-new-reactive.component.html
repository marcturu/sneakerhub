<div class="form-wrapper">
  <div class="card form-card">
    <div class="card-body">
      <h2 class="form-title">
        New product
        <span class="badge bg-primary ms-2">Reactive</span>
      </h2>

      <form [formGroup]="articleForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            [class.is-invalid]="name?.invalid && (name?.dirty || name?.touched)"
            placeholder="Nike Air Max 90"
            formControlName="name">
          <div class="invalid-feedback"
            *ngIf="name?.errors?.['required'] && (name?.dirty || name?.touched)">
            Product name is required
          </div>
          <div class="invalid-feedback"
            *ngIf="name?.errors?.['forbiddenName'] && (name?.dirty || name?.touched)">
            Product name can not be Prueba, Test, Mock or Fake
          </div>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Price</label>
          <div class="input-group">
            <span class="input-group-text">€</span>
            <input
              type="number"
              id="price"
              class="form-control"
              [class.is-invalid]="price?.invalid && (price?.dirty || price?.touched)"
              placeholder="109.99"
              formControlName="price">
            <div class="invalid-feedback"
              *ngIf="price?.errors?.['required'] && (price?.dirty || price?.touched)">
              Product price is required
            </div>
            <div class="invalid-feedback"
              *ngIf="price?.errors?.['min'] && (price?.dirty || price?.touched)">
              Minimum product price is 0,1 €
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="imageUrl" class="form-label">Image URL</label>
          <input
            type="text"
            id="imageUrl"
            class="form-control"
            [class.is-invalid]="imageUrl?.invalid && (imageUrl?.dirty || imageUrl?.touched)"
            placeholder="https://www.example.com/new-product.jpg"
            formControlName="imageUrl">
          <div class="invalid-feedback"
            *ngIf="imageUrl?.errors?.['required'] && (imageUrl?.dirty || imageUrl?.touched)">
            Image URL is required
          </div>
          <div class="invalid-feedback"
            *ngIf="imageUrl?.errors?.['pattern'] && (imageUrl?.dirty || imageUrl?.touched)">
            The sneaker image URL is not a valid URL
          </div>
        </div>

        <div class="mb-3">
          <div class="form-check">
            <input
              type="checkbox"
              id="isOnSale"
              class="form-check-input"
              formControlName="isOnSale">
            <label for="isOnSale" class="form-check-label">For sale</label>
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-success w-100 btn-submit">
          Create
        </button>

      </form>

    </div>
  </div>
</div>
